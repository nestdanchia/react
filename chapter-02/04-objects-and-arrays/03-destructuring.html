<!doctype html>
<html>
  <head>
    <meta
      name="viewport"
      content="minimum-scale=1.0, width=device-width, maximum-scale=1.0, user-scalable=no"
    />
    <meta charset="utf-8" />
    <title>Destructuring</title>
    <script src="https://unpkg.com/babel-standalone@6.15.0/babel.min.js"></script>
  </head>
  <body>
    <h1>Destructuring</h1>
    <p>Open the console</p>
    <script type="text/babel">
      // Destructuring object arguments

      var lordify = ({ firstname, spouse }) => {
        console.log(`${firstname} of canterbury`);
        console.log(`${spouse.firstname} of canterbury`);
      };
      var regularPerson = {
        firstname: "Dale",
        lastname: "Smith",
        spouse: {
          firstname: "Ana",
          lastname: "Wilson",
        },
      };

      lordify(regularPerson);
      const duque=({  spouse }) => {
      
        console.log(`${spouse.firstname} of canterbury`);
      };
      duque(regularPerson);
    </script>
  </body>
</html>

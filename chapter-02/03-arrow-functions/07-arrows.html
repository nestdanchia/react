<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="minimum-scale=1.0, width=device-width, maximum-scale=1.0, user-scalable=no"/>
    <meta charset="utf-8">
    <title>Arrow Functions</title>
    <script src="https://unpkg.com/babel-standalone@6.15.0/babel.min.js"></script>
</head>
<body>
<h1>Arrow Functions</h1>
<p>Open the console</p>
<script type="text/babel">

    // Function

    const tahoe = {
      resorts: ["Kirkwood","Squaw","Alpine","Heavenly","Northstar"],
      print: function(delay=1000) {
       console.log(this)
        setTimeout(function() {
          //Closure: La función tiene acceso a las variables del ámbito padre
           console.log(tahoe.resorts.join(""))//funciona perfectamente en una función regular porque estás accediendo directamente al objeto tahoe en lugar de usar this.
          console.log(this)//contexto global (window en navegador)
          console.log(this.resorts.join(","))
        }, delay)

      }
    }

    tahoe.print()//: Cannot read properties of undefined (reading 'join')

</script>
</body>
</html>
